<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beacon Prototype</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1 id="header"> </h1>

    <button id="removeBeaconButton" hidden>
      ➖ Remove Beacon
    </button>

    <div id="navigationInfo">
      <p id="directionOutput"></p>
      <p id="distanceOutput"></p>
      <p id="availableBeacon"></p>
    </div>

    <button id="addBeaconButton">
      ➕ Add Beacon
    </button>

  </main>

  <script src="app.js"></script>
</body>
</html>
